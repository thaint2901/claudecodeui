name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # .nvmrc pins v22 for the app runtime, but the server suite uses mock.module
          # (server/modules/websocket/tests/fork-name-writeback.test.ts), which needs
          # Node 24's --experimental-test-module-mocks.
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      # Floors guard against a glob that stops matching: Node's test runner exits 0
      # on zero matches, so "0 tests ran" is otherwise indistinguishable from success.
      # Current counts: server 232, client 77.
      - name: Server tests
        run: scripts/ci-test-floor.sh "npm run test:server" 200

      - name: Client tests
        run: scripts/ci-test-floor.sh "npm run test:client" 70
